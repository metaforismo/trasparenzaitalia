name: SIOPE dataset probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Calabria 2026 SIOPE spending dataset
        shell: python
        run: |
          import csv
          import io
          import json
          import time
          import urllib.parse
          import urllib.request

          action = "https://bdap-opendata.rgs.mef.gov.it/SpodCkanApi/api/3/action"
          dump = "https://bdap-opendata.rgs.mef.gov.it/SpodCkanApi/api/3/datastore/dump"
          code = "RND_SPE_SIO_REG18_001"
          headers = {"Accept": "application/json", "User-Agent": "TrasparenzaItalia-probe/1.0"}

          def read_url(url, timeout):
              last_error = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return response.read()
                  except Exception as error:
                      last_error = error
                      if attempt < 2:
                          time.sleep(2 * (attempt + 1))
              raise last_error

          params = urllib.parse.urlencode({"q": code, "rows": "50"})
          payload = json.loads(read_url(f"{action}/package_search?{params}", 90))

          candidates = []
          for package in payload.get("result", {}).get("results", []):
              title = str(package.get("title", ""))
              notes = str(package.get("notes", ""))
              if title.startswith("2026 - Calabria") and f"[{code}]" in notes:
                  candidates.append(package)

          assert candidates, "No Calabria 2026 SIOPE package found"
          package = candidates[0]
          package_id = package["id"]
          print("PACKAGE", package_id, package.get("title"), package.get("metadata_modified"))

          csv_headers = {"Accept": "text/csv", "User-Agent": "TrasparenzaItalia-probe/1.0"}
          request = urllib.request.Request(f"{dump}/{package_id}.csv", headers=csv_headers)
          with urllib.request.urlopen(request, timeout=120) as response:
              raw = response.read()

          text = raw.decode("utf-8-sig", errors="replace")
          sample = text[:4096]
          delimiter = ";" if sample.count(";") > sample.count(",") else ","
          rows = list(csv.DictReader(io.StringIO(text), delimiter=delimiter))
          assert rows, "Empty SIOPE CSV"

          print("HEADERS", json.dumps(list(rows[0].keys()), ensure_ascii=False))
          months = sorted({(row.get("Anno/Mese calendario") or "").strip() for row in rows if row.get("Anno/Mese calendario")})
          latest = months[-1]
          latest_rows = [row for row in rows if (row.get("Anno/Mese calendario") or "").strip() == latest]
          print("ROWS", len(rows), "MONTHS", months, "LATEST", latest, "LATEST_ROWS", len(latest_rows))

          def number(value):
              value = (value or "").strip().replace(" ", "")
              if not value:
                  return 0.0
              if "," in value and "." not in value:
                  value = value.replace(",", ".")
              return float(value)

          total = sum(number(row.get("Importo cumulato")) for row in latest_rows)
          print("LATEST_TOTAL", total)

          by_entity_type = {}
          by_title = {}
          by_entity = {}
          for row in latest_rows:
              value = number(row.get("Importo cumulato"))
              entity_type = (row.get("Descrizione Tipo Ente BDAP") or "Non indicato").strip()
              title = (row.get("Descrizione Titolo CG") or "Non indicato").strip()
              entity = (row.get("Descrizione Ente BDAP") or "Non indicato").strip()
              by_entity_type[entity_type] = by_entity_type.get(entity_type, 0.0) + value
              by_title[title] = by_title.get(title, 0.0) + value
              by_entity[entity] = by_entity.get(entity, 0.0) + value

          print("TOP_ENTITY_TYPES", json.dumps(sorted(by_entity_type.items(), key=lambda item: item[1], reverse=True)[:10], ensure_ascii=False))
          print("TOP_TITLES", json.dumps(sorted(by_title.items(), key=lambda item: item[1], reverse=True)[:15], ensure_ascii=False))
          print("TOP_ENTITIES", json.dumps(sorted(by_entity.items(), key=lambda item: item[1], reverse=True)[:15], ensure_ascii=False))
          print("SAMPLE", json.dumps(latest_rows[:3], ensure_ascii=False))
