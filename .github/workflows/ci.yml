name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Validate historical OpenBDAP API
        run: |
          npm run dev > /tmp/trasparenza-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          success=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 120 http://127.0.0.1:3000/api/spese/stato/storico -o /tmp/history.json; then
              success=1
              break
            fi
            sleep 2
          done

          if [ "$success" -ne 1 ]; then
            cat /tmp/trasparenza-next.log
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const history = JSON.parse(fs.readFileSync('/tmp/history.json', 'utf8'));
          console.log(JSON.stringify({
            year: history.year,
            latestMonth: history.latestMonth,
            points: history.points?.map((point) => ({
              month: point.month,
              cumulativePaid: point.cumulativePaid,
              monthlyPaid: point.monthlyPaid,
            })),
          }, null, 2));
          if (!history.ok || !Array.isArray(history.points) || history.points.length < 2) {
            throw new Error('Historical OpenBDAP API returned no usable series');
          }
          const latest = history.points.at(-1);
          if (!latest || !Number.isFinite(latest.cumulativePaid) || latest.cumulativePaid <= 0) {
            throw new Error('Historical OpenBDAP API returned invalid cumulative total');
          }
          const recomposed = history.points.reduce((sum, point) => sum + point.monthlyPaid, 0);
          const difference = Math.abs(recomposed - latest.cumulativePaid);
          if (difference > 0.1) {
            throw new Error(`Monthly deltas do not recompose the cumulative total: ${difference}`);
          }
          NODE

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Impeccable design detector
        run: npm run design:check

      - name: Build
        run: npm run build
