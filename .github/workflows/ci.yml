name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Validate OpenBDAP snapshot client
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          const { getStateSpendingSnapshot } = await import('./src/lib/bdap-payments.ts');
          const snapshot = await getStateSpendingSnapshot();
          const summary = {
            period: snapshot.period,
            totalPaid: snapshot.totalPaid,
            missions: snapshot.counts.missions,
            administrations: snapshot.counts.administrations,
            economicCategories: snapshot.counts.economicCategories,
            consistency: snapshot.consistency,
            sourcePackage: snapshot.sources.mission.packageId,
          };
          console.log(JSON.stringify(summary, null, 2));
          if (!Number.isFinite(snapshot.totalPaid) || snapshot.totalPaid <= 0) {
            throw new Error('OpenBDAP snapshot has an invalid total');
          }
          if (snapshot.counts.missions < 1) {
            throw new Error('OpenBDAP snapshot has no missions');
          }
          if (snapshot.period.year < 2020 || snapshot.period.month < 1 || snapshot.period.month > 12) {
            throw new Error('OpenBDAP snapshot period is invalid');
          }
          NODE

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Impeccable design detector
        id: impeccable
        continue-on-error: true
        run: npm run design:check

      - name: Build
        run: npm run build

      - name: Design quality summary
        if: always()
        run: |
          if [ "${{ steps.impeccable.outcome }}" = "failure" ]; then
            echo "::warning::Impeccable found design issues. The detector is diagnostic in this phase; fix or document them before turning it into a blocking gate."
          elif [ "${{ steps.impeccable.outcome }}" = "success" ]; then
            echo "Impeccable detector passed."
          else
            echo "Impeccable detector did not run because an earlier required step failed."
          fi
