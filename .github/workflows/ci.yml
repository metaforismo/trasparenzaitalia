name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Impeccable design detector
        run: npm run design:check

      - name: Build
        run: npm run build

  anac-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/anac-procurement-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect 2026 OCDS monthly bulk files
        shell: python
        run: |
          import json
          import urllib.error
          import urllib.request

          base = "https://dati.anticorruzione.it/opendata/download/dataset/ocds/filesystem/bulk"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36",
              "Accept": "application/json,*/*;q=0.5",
              "Range": "bytes=0-0",
          }

          results = []
          for month in range(1, 9):
              url = f"{base}/2026/{month:02d}.json"
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      response.read(1)
                      results.append({
                          "month": month,
                          "status": response.status,
                          "contentLength": response.headers.get("Content-Length"),
                          "contentRange": response.headers.get("Content-Range"),
                          "lastModified": response.headers.get("Last-Modified"),
                          "etag": response.headers.get("ETag"),
                          "contentType": response.headers.get("Content-Type"),
                      })
              except urllib.error.HTTPError as error:
                  results.append({"month": month, "status": error.code})
              except Exception as error:
                  results.append({"month": month, "error": repr(error)})

          print(json.dumps(results, ensure_ascii=False, indent=2))
          available = [item for item in results if item.get("status") in (200, 206)]
          assert available, "No 2026 ANAC OCDS month reachable"
