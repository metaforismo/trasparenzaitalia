name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Impeccable design detector
        id: impeccable
        continue-on-error: true
        run: npm run design:check

      - name: Build
        run: npm run build

      - name: Design quality summary
        if: always()
        run: |
          if [ "${{ steps.impeccable.outcome }}" = "failure" ]; then
            echo "::warning::Impeccable found design issues. The detector is diagnostic in this phase; fix or document them before turning it into a blocking gate."
          else
            echo "Impeccable detector passed."
          fi
