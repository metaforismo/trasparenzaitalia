name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Impeccable design detector
        run: npm run design:check

      - name: Build
        run: npm run build

  anac-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/anac-procurement-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect ANAC OCDS transport paths
        shell: python
        run: |
          import json
          import urllib.error
          import urllib.request

          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36",
              "Accept": "application/json,*/*;q=0.5",
          }

          def inspect(url, extra_headers=None):
              request_headers = dict(headers)
              request_headers.update(extra_headers or {})
              request = urllib.request.Request(url, headers=request_headers)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read(2048)
                      return {
                          "url": url,
                          "status": response.status,
                          "contentType": response.headers.get("Content-Type"),
                          "contentLength": response.headers.get("Content-Length"),
                          "contentRange": response.headers.get("Content-Range"),
                          "lastModified": response.headers.get("Last-Modified"),
                          "etag": response.headers.get("ETag"),
                          "body": body.decode("utf-8", errors="replace"),
                      }
              except urllib.error.HTTPError as error:
                  body = error.read(2048).decode("utf-8", errors="replace")
                  return {
                      "url": url,
                      "status": error.code,
                      "contentType": error.headers.get("Content-Type"),
                      "body": body,
                  }
              except Exception as error:
                  return {"url": url, "error": repr(error)}

          base_api = "https://api.anticorruzione.it/opendata/ocds/api/v1/1.0.0"
          probes = [
              inspect(f"{base_api}/version"),
              inspect(f"{base_api}/tender/id/count/active"),
              inspect(
                  "https://dati.anticorruzione.it/opendata/download/dataset/ocds/filesystem/bulk/2026/07.json",
                  {"Range": "bytes=0-0"},
              ),
          ]

          print(json.dumps(probes, ensure_ascii=False, indent=2))

          api_results = probes[:2]
          reachable = [item for item in api_results if item.get("status") in (200, 206)]
          assert reachable, "ANAC OCDS API host is not reachable from the GitHub runner"
